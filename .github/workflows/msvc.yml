name: cmake - Microsoft C++ Code Analysis

on:
  workflow_dispatch:
  # push:
    # branches: [ "master" ]
  # pull_request:
    # branches: [ "master" ]
  # schedule:
    # - cron: '31 23 * * 2'

permissions:
  contents: read
  security-events: write
  actions: read
  
env:
  BUILD_TYPE: Release
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache

jobs:
  analyze:
    name: Analyze
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Ensure vcpkg binary cache directory exists
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${env:VCPKG_DEFAULT_BINARY_CACHE}" | Out-Null
          Write-Host "Created/verified: ${env:VCPKG_DEFAULT_BINARY_CACHE}"

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show tool versions
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          echo "VCPKG_ROOT=$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\vcpkg.exe" version

      #
      # Caches the manifest-installed packages.
      # Cache key changes automatically when vcpkg.json changes.
      #
      - name: Cache vcpkg installed
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.VCPKG_ROOT }}/downloads
            ${{ env.VCPKG_ROOT }}/packages
            ${{ env.VCPKG_ROOT }}/buildtrees
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}       
            .vcpkg-cache
          key: >
              vcpkg-${{ runner.os }}-
              ${{ hashFiles('vcpkg.json',
                'vcpkg-configuration.json',
                '**/CMakeLists.txt') }}

      - name: Show vcpkg cache status
        shell: pwsh
        run: |
          echo "VCPKG_BINARY_SOURCES=$env:VCPKG_BINARY_SOURCES"
    
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --parallel
