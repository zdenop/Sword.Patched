name: cmake - Microsoft C++ Code Analysis

on:
  workflow_dispatch:
  # push:
    # branches: [ "master" ]
  # pull_request:
    # branches: [ "master" ]
  # schedule:
    # - cron: '31 23 * * 2'

permissions:
  contents: read
  security-events: write
  actions: read
  
env:
  # Path to the CMake build directory.
  build: '${{ github.workspace }}/build'
  BUILD_TYPE: Release
  # Use GitHub Actions cache as vcpkg binary cache to speed up rebuilds
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  analyze:
    name: Analyze
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show tool versions
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          echo "VCPKG_ROOT=$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\vcpkg.exe" version

      #
      # Caches the manifest-installed packages.
      # Cache key changes automatically when vcpkg.json changes.
      #
      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\vcpkg_installed
            ${{ github.workspace }}\build\vcpkg_installed
          key: >
            vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --parallel
