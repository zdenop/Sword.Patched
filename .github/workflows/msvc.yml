name: cmake - Microsoft C++ Code Analysis

on:
  workflow_dispatch:
  # push:
    # branches: [ "master" ]
  # pull_request:
    # branches: [ "master" ]
  # schedule:
    # - cron: '31 23 * * 2'

env:
  # Path to the CMake build directory.
  build: '${{ github.workspace }}/build'
  BUILD_TYPE: Release
  # Use GitHub Actions cache as vcpkg binary cache to speed up rebuilds
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

permissions:
  contents: read

jobs:
  analyze:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Analyze
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Required for the `x-gha` binary cache backend
      - name: Export GitHub Actions cache env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show vcpkg version
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT/vcpkg.exe" --version

      - name: Install dependencies via vcpkg
        run: |
          & "$env:VCPKG_ROOT/vcpkg.exe" install --triplet x64-windows

      - name: Configure CMake
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
            
      # - name: Configure CMake
        # run: cmake -B ${{ env.build }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      # - name: Run tests
        # run: |
          # cd build
          # ctest -C ${{ env.BUILD_TYPE }} --output-on-failure
          
      # Build is not required unless generated source files are used
      # - name: Build CMake
      #   run: cmake --build ${{ env.build }}

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            build/*.exe
            build/**/*.dll
            build/**/*.pdb
          if-no-files-found: ignore

      - name: Initialize MSVC Code Analysis
        uses: microsoft/msvc-code-analysis-action@04825f6d9e00f87422d6bf04e1a38b1f3ed60d99
        # Provide a unique ID to access the sarif output path
        id: run-analysis
        with:
          cmakeBuildDirectory: ${{ env.build }}
          # Ruleset file that will determine what checks will be run
          ruleset: NativeRecommendedRules.ruleset

      # Upload SARIF file to GitHub Code Scanning Alerts
      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.run-analysis.outputs.sarif }}

      # Upload SARIF file as an Artifact to download and view
      # - name: Upload SARIF as an Artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: sarif-file
      #     path: ${{ steps.run-analysis.outputs.sarif }}
